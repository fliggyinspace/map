	}

.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {

	/* Fallback for FF which doesn't support pinch-zoom */

}

	-ms-touch-action: none;
	touch-action: none;
}

}

}

	}

/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */

.leaflet-div-icon {

<style>:root{
  --bg:#f3f1ec;
  --panel:#ffffff;
  --ink:#1d2025;
  --sub:#6f7480;
  --line:#e7e3db;
  --soft:#f8f6f1;
  --accent:#ff6b35;
  --accent-deep:#e9531f;
  --green:#16a34a;
  --gray:#9ca3af;
  --blue:#2563eb;
  --radius:13px;
  --shadow:0 8px 28px rgba(28,24,18,.10);
  --shadow-sm:0 2px 8px rgba(28,24,18,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent-deep)}
.hidden{display:none !important}
.grow{flex:1}

.app{display:grid;grid-template-columns:380px 1fr;height:100vh;height:100dvh;overflow:hidden}

/* ============ 侧栏 ============ */
.sidebar{
  display:flex;flex-direction:column;min-width:0;min-height:0;
  background:var(--panel);border-right:1px solid var(--line);
  position:relative;z-index:5;
}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:40px;height:40px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,#ff9558,#ff5a24);
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;
  box-shadow:0 6px 14px rgba(255,107,53,.32);
}
.brand-text{min-width:0}
.brand h1{font-size:17px;margin:0;letter-spacing:.4px;white-space:nowrap}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:34px;height:34px;border-radius:10px;flex:none;
  display:grid;place-items:center;font-size:18px;color:var(--sub);
  background:var(--soft);
}
.icon-btn:hover{background:#efece5;color:var(--ink)}

.loc-card{
  margin:0 14px 10px;padding:11px 12px;border-radius:12px;
  background:var(--soft);border:1px solid #efebe3;
  display:flex;flex-direction:column;gap:9px;
}
.loc-main{display:flex;align-items:center;gap:9px;min-width:0}
.loc-dot{width:9px;height:9px;border-radius:50%;background:#c9c3b9;flex:none;transition:.2s}
.loc-card.on .loc-dot{background:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.loc-text{display:flex;flex-direction:column;min-width:0;gap:1px}
.loc-text b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-text span{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-actions{display:flex;gap:8px}

.btn{
  border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:9px 14px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:.15s;white-space:nowrap;
}
.btn:hover{background:#faf8f4;border-color:#ddd7cc}
.btn:active{transform:scale(.98)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}

.search-row{padding:0 14px 10px}

.status-tabs{display:flex;gap:6px;padding:0 14px 9px;overflow-x:auto;scrollbar-width:none}

.chips-wrap{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none}

.chip{

}

.radius-wrap{display:flex;align-items:center;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}

.list{display:flex;flex-direction:column;gap:8px;padding:0 12px}
.locate-cta{
  width:100%;text-align:left;padding:10px 12px;border-radius:11px;

}

.card{
  position:relative;display:flex;gap:10px;align-items:flex-start;

  border:1px solid var(--line);text-align:left;width:100%;

}

.card-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gray)}
.card-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}

}
.tag.play{color:#0369a1;background:#e0f2fe;border-color:#bae6fd}
.card-meta{font-size:11.8px;color:var(--sub);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-note{font-size:11.8px;color:#4b5058;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-dist{flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--ink);padding-top:2px;min-width:52px}

.empty{padding:34px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}

.side-foot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.side-foot .btn{height:40px}

/* ============ 地图 ============ */
.map-wrap{position:relative;min-width:0;background:#e8e4dc;isolation:isolate}
#map{position:absolute;inset:0;z-index:1}
.leaflet-container{font-family:inherit;background:#e8e4dc}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.78);border-radius:6px 0 0 0;padding:1px 6px}

.map-tools{
  position:absolute;top:14px;right:14px;z-index:500;

}
.map-tools button{
  width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--line);

  display:grid;place-items:center;
}
.map-tools button:hover{background:#faf8f4}
.map-tools #btnBasemap{width:auto;padding:0 11px;font-size:12px;letter-spacing:.5px}

.pick-banner{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:600;
  display:flex;align-items:center;gap:10px;
  background:#1d2025;color:#fff;padding:9px 10px 9px 15px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);

}
.pick-banner .btn{color:#fff;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08)}

body.picking #map{cursor:crosshair}

.legend{
  position:absolute;left:14px;bottom:14px;z-index:500;
  display:flex;gap:12px;align-items:center;
  background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
  padding:7px 11px;border-radius:999px;font-size:11.5px;color:#4b5058;
  box-shadow:var(--shadow-sm);border:1px solid rgba(0,0,0,.04);
}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend i.legend-play{background:#0ea5e9;border-radius:3px}

/* 标记 */
.map-pin{background:none;border:0}
.pin{
  position:relative;width:100%;height:22px;border-radius:11px;padding:0 1px;
  background:var(--c,#ff7a45);border:2px solid #fff;
  box-shadow:0 3px 8px rgba(0,0,0,.30);
  display:flex;align-items:center;justify-content:center;
  transform-origin:50% 100%;transition:transform .12s;
}
.pin::after{
  content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:5px solid transparent;border-top:6px solid var(--c,#ff7a45);margin-top:-1px;
}
.pin span{color:#fff;font-size:9.5px;font-weight:800;line-height:1;letter-spacing:.2px;white-space:nowrap}
.pin.sel{transform:scale(1.18);z-index:2}
.pin.play{border-radius:7px}
.pin.play::after{display:none}
.pin.play span{font-size:9.5px}
.pin.approx::before{
  content:"";position:absolute;inset:-4px;border-radius:inherit;
  border:1.4px dashed rgba(0,0,0,.28);
}
.td-cluster-wrap{background:none;border:0}
.td-cluster{
  width:34px;height:34px;border-radius:50%;background:#ff6b35;color:#fff;
  display:flex;align-items:center;justify-content:center;
  border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.28);
  font-size:12px;font-weight:800;letter-spacing:.2px;
}
.td-cluster.play{background:#0ea5e9}
.td-cluster b{font-weight:800}

.me-dot{
  width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);position:relative;
}
.me-dot::after{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  border:2px solid rgba(37,99,235,.45);animation:ping 2.2s ease-out infinite;
}
@keyframes ping{0%{transform:scale(.5);opacity:.9}80%,100%{transform:scale(1.7);opacity:0}}

.pin-tip{
  background:#1d2025 !important;color:#fff !important;border:0 !important;
  font-size:11.5px !important;font-weight:600 !important;padding:4px 8px !important;
  border-radius:7px !important;box-shadow:0 4px 12px rgba(0,0,0,.2) !important;
}
.pin-tip::before{border-top-color:#1d2025 !important}

/* ============ 底部导航（仅手机） ============ */
.bottom-nav{display:none}

/* ============ 详情面板 ============ */
.sheet{
  position:fixed;top:0;right:0;z-index:60;
  width:400px;max-width:100%;height:100vh;height:100dvh;
  background:#fff;box-shadow:-12px 0 44px rgba(20,16,10,.14);
  display:flex;flex-direction:column;
  transform:translateX(104%);transition:transform .26s cubic-bezier(.2,.7,.3,1);
  visibility:hidden;
}
.sheet.open{transform:none;visibility:visible}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-head-main{min-width:0}
.pill{
  display:inline-block;font-size:11px;font-weight:700;color:#fff;
  background:var(--c,#ff7a45);padding:2px 8px;border-radius:999px;margin-bottom:8px;
}
.sheet-head h2{margin:0 0 4px;font-size:19px;line-height:1.3;word-break:break-word}
.sheet-sub{font-size:12.5px;color:var(--sub)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 20px}
.dist-box{
  background:linear-gradient(135deg,#fff6ef,#fffaf6);border:1px solid #ffe2d1;
  border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:2px;margin-bottom:14px;
}
.dist-box b{font-size:19px;color:var(--accent-deep);letter-spacing:.3px}
.dist-box span{font-size:11.5px;color:#8a6a58}
.dist-box.muted{background:var(--soft);border-color:var(--line)}
.dist-box.muted b{font-size:15px;color:var(--sub)}
.info-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #eee9e0;font-size:13px}
.info-row:last-child{border-bottom:0}
.info-row>span{flex:none;width:52px;color:var(--sub);font-size:12px;padding-top:1px}
.info-row p{margin:0;flex:1;min-width:0;line-height:1.55;word-break:break-word}
.info-row .note{white-space:pre-wrap}
.info-row .xhs-links{display:flex;flex-direction:column;gap:5px}
.info-row .xhs-links a{
  color:#e11d48;text-decoration:none;font-size:12.5px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.info-row .xhs-links a:hover{text-decoration:underline}
.info-row .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:#4b5058}
.chips-inline{display:flex;flex-wrap:wrap;gap:6px}
.chips-inline em{font-style:normal;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:2px 8px;border-radius:7px}
.info-row .tag{vertical-align:1px}
.sheet-foot{
  display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:#fff;
}
.sheet-foot .btn{flex:1;min-width:88px;height:40px}

/* ============ 弹窗 ============ */
.modal{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(24,20,14,.42);backdrop-filter:blur(2px);padding:16px;
}
.modal-card{
  background:#fff;border-radius:18px;width:460px;max-width:100%;max-height:92vh;
  box-shadow:0 24px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;
  animation:pop .18s ease-out;
}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.modal-head h2{margin:0;font-size:17px}
.form-card form{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;padding:0}
.form-body{padding:0 18px;overflow-y:auto;flex:1 1 auto;min-height:0}
.form-card .modal-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));flex:none}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;min-width:0}
.field>span{font-size:12px;color:var(--sub);font-weight:600}
.field>span i{color:#e11d48;font-style:normal}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  font-size:13.5px;background:var(--soft);outline:none;transition:.15s;
}
.field textarea{resize:vertical;min-height:76px;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#ffb894;background:#fff;box-shadow:0 0 0 3px rgba(255,107,53,.10)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-hint{margin:2px 0 14px;font-size:11.5px;color:var(--sub);line-height:1.55;background:var(--soft);padding:8px 10px;border-radius:9px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--line)}
.modal-foot .btn{min-width:92px;height:38px}

.hint{font-size:12.5px;color:var(--sub);line-height:1.6;margin:0 18px 10px}
.bulk-text{
  margin:0 18px;width:calc(100% - 36px);min-height:190px;border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;font-size:13px;line-height:1.7;background:var(--soft);
  outline:none;resize:vertical;font-family:inherit;
}
.bulk-text:focus{border-color:#ffb894;background:#fff}
.bulk-preview{padding:9px 18px;font-size:12px;color:var(--sub)}
.bulk-preview b{color:var(--accent-deep)}
.menu-card{padding-bottom:8px}
.menu-item{
  display:flex;align-items:center;width:calc(100% - 24px);margin:0 12px 4px;padding:12px;
  border-radius:10px;font-size:13.5px;text-align:left;
}
.menu-item:hover{background:var(--soft)}
.menu-item.danger{color:#dc2626}
.menu-note{margin:10px 18px 12px;font-size:11.5px;color:var(--sub);line-height:1.6}

/* ============ Toast ============ */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  z-index:90;background:#1d2025;color:#fff;font-size:13px;font-weight:500;
  padding:10px 16px;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);
  opacity:0;pointer-events:none;transition:.22s;
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{
  color:#ffb894;font-weight:700;font-size:12.5px;white-space:nowrap;
  border-left:1px solid rgba(255,255,255,.18);padding-left:12px;
}

/* ============ 手机 ============ */
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;inset:0 0 calc(60px + env(safe-area-inset-bottom)) 0;z-index:40;border-right:0;
    padding-top:env(safe-area-inset-top);
    transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.7,.3,1);

  .bottom-nav .nav-add span{font-size:21px}
  .map-tools{top:calc(12px + env(safe-area-inset-top));right:12px}
  .legend{bottom:calc(76px + env(safe-area-inset-bottom));left:12px}
  .sheet{
    top:auto;bottom:0;left:0;right:0;width:auto;height:auto;max-height:88dvh;

  }
  .sheet.open{transform:none}
  .sheet-head{padding:16px 16px 10px}
  .sheet-body{padding:12px 16px 16px}
  .sheet-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sheet-foot .btn{min-width:0;width:100%}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom))}
  .modal{padding:0;align-items:flex-end}
  .modal-card{width:100%;max-height:94dvh;border-radius:18px 18px 0 0}
  .grid2{grid-template-columns:1fr 1fr;gap:8px}
}

@media (max-width: 380px){
  .brand h1{font-size:16px}
  .card-dist{min-width:46px}
}

/* ============ Netlify 免费版徽标避让 ============ */
/* 徽标由 Netlify 注入在右下角（#nl-badge-frame），检测到后整体让出底部空间 */

  body.has-nl-badge .bottom-nav{
    left:12px;right:auto;bottom:calc(12px + env(safe-area-inset-bottom));
    transform:none;flex-direction:column;
    width:auto;height:auto;padding:6px;gap:4px;
    border-top:0;border-radius:20px;border:1px solid rgba(0,0,0,.06);
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:0 10px 30px rgba(0,0,0,.18);
  }
  body.has-nl-badge .bottom-nav button{
    flex:0 0 auto;width:62px;height:54px;border-radius:14px;gap:2px;font-size:10px;
  }
  body.has-nl-badge .bottom-nav button.active{background:var(--soft)}
  body.has-nl-badge .legend{
    top:calc(14px + env(safe-area-inset-top));bottom:auto;left:12px;
  }
  body.has-nl-badge.picking .legend{display:none}
  body.has-nl-badge .toast{bottom:calc(210px + env(safe-area-inset-bottom))}
}

      <button class="btn primary grow" id="btnAdd">＋ 标记一家</button>
      <button class="btn ghost" id="btnBulk">批量粘贴</button>
    </footer>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <div class="map-tools">
      <button id="btnBasemap" title="切换底图">标准</button>
      <button id="btnZoomIn" title="放大">＋</button>
      <button id="btnZoomOut" title="缩小">－</button>
      <button id="btnMyLoc" title="回到我的位置">◎</button>
    </div>
    <div class="pick-banner hidden" id="pickBanner">
      <span id="pickText">点击地图选择位置</span>
      <button class="btn sm ghost" id="pickSkip">跳过</button>
      <button class="btn sm ghost" id="pickCancel">取消</button>
    </div>
    <div class="legend">
      <span><i style="background:#ff7a45"></i>想吃</span>
      <span><i style="background:#16a34a"></i>已吃</span>
      <span><i style="background:#9ca3af"></i>踩雷</span>
      <span><i class="legend-play"></i>游玩</span>
    </div>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-nav="map" class="active"><span>◎</span>地图</button>
    <button data-nav="list"><span>☰</span>列表</button>
    <button data-nav="add" class="nav-add"><span>＋</span>添加</button>
  </nav>
</div>

<div class="modal hidden" id="modal"></div>
<div class="toast" id="toast"></div>

<script>/* 美食地图 —— 一个本地跑的「饭馆收藏夹 + 地图」

(function () {
  'use strict';

  /* ================= 常量 ================= */
  var LS_KEY = 'tandian.map.v1';
  var SEED_KEY = 'tandian.map.seedver';
  /* 旧版测试数据（14 家奥森示例）已下线：用户浏览器里若还存着，首次加载时清掉 */
  var TEST_NAMES = [
    '三江里', '雅佳神话·鲜活烤鱼（亚运村店）', '海底捞（清河中街店）',
    '水木锦堂自助铁板烧（清河万象汇）', '外婆家（清河万象汇）', '比格比萨（林萃路店）',
    '呷哺呷哺（华润奥运村店）', '兰特伯爵西餐厅·啤酒屋（国奥村店）',
    '新净雅（奥森国家网球中心店）', '犟骨头排骨饭（奥运村华创店）',
    '塔斯汀中国汉堡（科荟路店）', '眉州东坡（龙德广场店）',
    '西贝（龙德广场店）', '便宜坊（五彩城店）'
  ];
  var STATUS = {
    want:  { label: '想吃', color: '#ff7a45' },
    been:  { label: '已吃', color: '#16a34a' },
    avoid: { label: '踩雷', color: '#9ca3af' }
  };
  var STATUS_ORDER = ['want', 'been', 'avoid'];
  var RADII = [
    { v: 0, label: '不限' },
    { v: 500, label: '500 m' },
    { v: 1000, label: '1 km' },
    { v: 3000, label: '3 km' },
    { v: 5000, label: '5 km' }
  ];

  /* ================= 小工具 ================= */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function numOrNull(v) {
    if (v === '' || v == null) return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function findPlace(id) {
    for (var i = 0; i < state.places.length; i++) if (state.places[i].id === id) return state.places[i];
    return null;
  }
  function hasCoord(p) { return p && typeof p.lat === 'number' && typeof p.lng === 'number'; }

  function haversine(a, b) {
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad;
    var dLng = (b.lng - a.lng) * rad;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function fmtDist(m) {
    if (m == null || !isFinite(m)) return '';
    if (m < 1000) return Math.round(m / 10) * 10 + ' m';
    return (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' km';
  }
  function walkMin(m) { return Math.max(1, Math.round(m / 75)); }
  function driveMin(m) { return Math.max(2, Math.round(m / 500 + 2)); }

  function toast(msg, opts) {
    opts = opts || {};
    var t = $('#toast');
    t.innerHTML = '<span>' + esc(msg) + '</span>' +
      (opts.action ? '<button type="button">' + esc(opts.action) + '</button>' : '');
    t.classList.add('show');
    if (opts.action) {
      var b = t.querySelector('button');
      b.addEventListener('click', function () {
        t.classList.remove('show');
        if (opts.onAction) opts.onAction();
      });
    }
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function () { t.classList.remove('show'); }, opts.duration || 3200);
  }

  /* ================= 坐标转换（WGS84 -> GCJ02） ================= */
  var A = 6378245.0, EE = 0.00669342162296594323;
  function outOfChina(lat, lng) { return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55); }
  function tLat(x, y) {
    var r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
    r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
    r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
    return r;
  }
  function tLng(x, y) {
    var r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
    r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
    r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
    return r;
  }
  function wgs2gcj(lat, lng) {
    if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
    var dLat = tLat(lng - 105, lat - 35);
    var dLng = tLng(lng - 105, lat - 35);
    var radLat = lat / 180 * Math.PI;
    var magic = Math.sin(radLat);
    magic = 1 - EE * magic * magic;
    var sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180) / ((A * (1 - EE)) / (magic * sqrtMagic) * Math.PI);
    dLng = (dLng * 180) / (A / sqrtMagic * Math.cos(radLat) * Math.PI);
    return { lat: lat + dLat, lng: lng + dLng };
  }

  /* ================= 状态 ================= */
  var state = {
    places: [],
    myLoc: null,
    q: '',
    kind: 'all',
    status: 'all',
    cuisine: 'all',
    radius: 0,
    selected: null
  };
  var pickMode = null;          /* {kind:'mine'} | {kind:'move',placeId} | {kind:'queue',ids:[],i:0} */
  var markers = {};
  var cluster = null;
  var meMarker = null;
  var meCircle = null;
  var meKey = '';
  var map = null;
  var editing = null;
  var storageWarned = false;
  var baseMode = 'standard';

  /* ================= 存取 ================= */
  function normalize(p) {
    return {
      id: p.id || uid(),
      name: String(p.name || '未命名'),
      short: p.short || '',
      kind: p.kind === 'play' ? 'play' : 'eat',
      category: p.category || '',
      season: p.season || '',
      indoor: !!p.indoor,
      cost: p.cost || '',
      xhs: Array.isArray(p.xhs) ? p.xhs.filter(function (x) { return x && x.url; }).slice(0, 2) : [],
      cuisine: p.cuisine || '',
      price: numOrNull(p.price),
      rating: numOrNull(p.rating),
      status: STATUS[p.status] ? p.status : 'want',
      lat: numOrNull(p.lat),
      lng: numOrNull(p.lng),
      approx: !!p.approx,
      address: p.address || '',
      area: p.area || '',
      note: p.note || '',
      dishes: Array.isArray(p.dishes) ? p.dishes.filter(Boolean) : [],
      source: p.source || '',
      sourceTitle: p.sourceTitle || '',
      person: p.person || '',
      categories: Array.isArray(p.categories) ? p.categories.filter(Boolean) : [],
      createdAt: p.createdAt || Date.now()
    };
  }
  function seedPlace(p) {
    var q = normalize(p);
    if (!q.id) q.id = uid();
    return q;
  }
  /* 内置词条升级：保留用户自己加的店，以及已有店的 status/笔记/推荐菜 */
  function mergeSeeds() {
    var seed = window.SEED_PLACES || [];
    var ver = String(window.SEED_VERSION || '');
    var savedVer = '';
    try { savedVer = localStorage.getItem(SEED_KEY) || ''; } catch (e) {}
    if (!seed.length || (ver && savedVer === ver)) return false;
    var prev = {};
    state.places.forEach(function (p) { prev[p.name] = p; });
    var seedNames = {};
    seed.forEach(function (s) { seedNames[s.name] = 1; });
    var extras = state.places.filter(function (p) {
      return !seedNames[p.name] && TEST_NAMES.indexOf(p.name) < 0;
    });
    state.places = seed.map(function (s) {
      var q = seedPlace(s);
      var old = prev[s.name];
      if (old) {
        q.status = old.status;
        q.id = old.id;
        if (old.note && !q.note) q.note = old.note;
        if (old.dishes && old.dishes.length) q.dishes = old.dishes;
      }
      return q;
    }).concat(extras);
    try { localStorage.setItem(SEED_KEY, ver); } catch (e) {}
    save();
    return true;
  }
  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.places)) return false;
      state.places = d.places.map(normalize);
      var hadTest = false;
      state.places = state.places.filter(function (p) {
        if (TEST_NAMES.indexOf(p.name) >= 0) { hadTest = true; return false; }
        return true;
      });
      state.myLoc = d.myLoc && typeof d.myLoc.lat === 'number' ? d.myLoc : null;
      /* 旧数据补字段：按店名从内置条目补 area（商圈） */
      if (window.SEED_PLACES) {
        var byName = {};
        window.SEED_PLACES.forEach(function (s) { if (s && s.name) byName[s.name] = s; });
        var fixed = false;
        state.places.forEach(function (p) {
          var s = byName[p.name];
          if (s && s.area && p.area !== s.area) { p.area = s.area; fixed = true; }
        });
        if (fixed) save();
      }
      /* 内置词条版本变了：替换内置条目、保留用户新增 */
      mergeSeeds();
      /* 旧数据里只有测试店：当作没有数据，让 boot 重新载入内置真实条目 */
      if (hadTest && !state.places.length) return false;
      return true;
    } catch (e) { return false; }
  }
  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        version: 1,
        places: state.places,
        myLoc: state.myLoc,
        savedAt: Date.now()
      }));
    } catch (e) {
      if (!storageWarned) {
        storageWarned = true;
        toast('浏览器不允许本地保存，记得用「导出」备份');
      }
    }
  }

  /* ================= 地图 ================= */
  function initTiles() {
    tiles = {
      standard: L.tileLayer(
        'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
        { subdomains: ['1', '2', '3', '4'], maxZoom: 18, minZoom: 3 }
      ),
      satellite: L.tileLayer(
        'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
        { subdomains: ['1', '2', '3', '4'], maxZoom: 18, minZoom: 3 }
      )
    };
  }

  function initMap() {
    if (typeof L === 'undefined') return;
    initTiles();
    map = L.map('map', {
      zoomControl: false,
      attributionControl: true,
      minZoom: 3,
      maxZoom: 18,
      worldCopyJump: true
    });
    map.attributionControl.setPrefix(false);
    map.attributionControl.addAttribution('© 高德地图');

    tiles.standard.addTo(map);

    if (L.markerClusterGroup) {
      cluster = L.markerClusterGroup({
        maxClusterRadius: 44,
        disableClusteringAtZoom: 13,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        iconCreateFunction: function (c) {
          var kids = c.getAllChildMarkers();
          var play = 0;
          kids.forEach(function (m) { if (m.options.kind === 'play') play++; });
          return L.divIcon({
            className: 'td-cluster-wrap',
            html: '<div class="td-cluster' + (play * 2 > kids.length ? ' play' : '') + '"><b>' +
              kids.length + '</b></div>',
            iconSize: [34, 34]
          });
        }
      });
      cluster.addTo(map);
    }

    map.on('click', function (e) {
      if (!pickMode) return;
      handlePick(e.latlng.lat, e.latlng.lng);
    });

    var errShown = false;
    tiles.standard.on('tileerror', function () {
      if (errShown) return;
      errShown = true;
      toast('底图加载失败，检查一下网络');
    });

    if (state.myLoc) {
      map.setView([state.myLoc.lat, state.myLoc.lng], 13);
    } else {
      var pts = state.places.filter(hasCoord).map(function (p) { return [p.lat, p.lng]; });
      if (pts.length) {
        map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 15 });
      } else {
        map.setView([39.93, 116.40], 11);
      }
    }
    updateMe(true);
  }

  var tiles = null;

  function setBasemap(mode) {
    if (!map || !tiles) return;
    baseMode = mode;
    map.removeLayer(tiles.standard);
    map.removeLayer(tiles.satellite);
    tiles[mode].addTo(map);
    $('#btnBasemap').textContent = mode === 'standard' ? '标准' : '卫星';
    if (mode === 'satellite') toast('卫星图没有路名，找路时切回「标准」');
  }

  function updateMe(force) {
    if (!map) return;
    var key = state.myLoc ? (state.myLoc.lat + ',' + state.myLoc.lng + ',' + state.radius) : '';
    if (!force && key === meKey) return;
    meKey = key;
    if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
    if (meCircle) { map.removeLayer(meCircle); meCircle = null; }
    if (!state.myLoc) return;
    var ll = [state.myLoc.lat, state.myLoc.lng];
    meMarker = L.marker(ll, {
      icon: L.divIcon({ className: 'map-pin', html: '<div class="me-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }),
      interactive: false,
      zIndexOffset: 1200
    }).addTo(map);
    if (state.radius > 0) {
      meCircle = L.circle(ll, {
        radius: state.radius,
        color: '#2563eb', weight: 1.2, opacity: 0.7,
        fillColor: '#2563eb', fillOpacity: 0.06, dashArray: '5 5',
        interactive: false
      }).addTo(map);
    }
  }

  function pinIcon(p, sel) {
    var st = STATUS[p.status] || STATUS.want;
    var play = p.kind === 'play';
    var label = String(p.short || p.name || '?').trim().slice(0, 5) || '?';
    var w = Math.max(24, label.length * 10 + 10);
    return L.divIcon({
      className: 'map-pin',
      html: '<div class="pin' + (play ? ' play' : '') + (sel ? ' sel' : '') + (p.approx ? ' approx' : '') +
        '" style="--c:' + (play ? '#0ea5e9' : st.color) + '"><span>' + esc(label) + '</span></div>',
      iconSize: play ? [w, 22] : [w, 30],
      iconAnchor: play ? [w / 2, 11] : [w / 2, 30]
    });
  }

  function syncMarkers() {
    if (!map) return;
    var vis = visiblePlaces();
    var keep = {};
    vis.forEach(function (p) {
      if (!hasCoord(p)) return;
      keep[p.id] = true;
      var m = markers[p.id];
      var sel = state.selected === p.id;
      if (!m) {
        m = L.marker([p.lat, p.lng], { icon: pinIcon(p, sel), riseOnHover: true, kind: p.kind });
        m.on('click', function (e) {
          L.DomEvent.stopPropagation(e);
          if (pickMode) { handlePick(m.getLatLng().lat, m.getLatLng().lng); return; }
          selectPlace(p.id, true);
        });
        m.bindTooltip(esc(p.name), { direction: 'top', offset: [0, p.kind === 'play' ? -26 : -34], className: 'pin-tip' });
        if (cluster) cluster.addLayer(m); else m.addTo(map);
        markers[p.id] = m;
      } else {
        m.setLatLng([p.lat, p.lng]);
        m.setIcon(pinIcon(p, sel));
      }
    });
    Object.keys(markers).forEach(function (id) {
      if (!keep[id]) {
        if (cluster) cluster.removeLayer(markers[id]); else map.removeLayer(markers[id]);
        delete markers[id];
      }
    });
  }

  /* ================= 筛选 / 排序 ================= */
  function distanceOf(p) {
    if (!state.myLoc || !hasCoord(p)) return null;
    return haversine(state.myLoc, p);
  }

  function catOf(p) {
    return p.kind === 'play' ? (p.category || '') : (p.cuisine || '');
  }

  function visiblePlaces() {
    var q = state.q.trim().toLowerCase();
    var arr = state.places.filter(function (p) {
      if (q) {
        var hay = [p.name, p.cuisine, p.category, p.area, p.address, p.note, p.person, p.sourceTitle,
          p.season, p.cost, p.indoor ? '室内' : '室外',
          (p.categories || []).join(' '), (p.dishes || []).join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (state.kind !== 'all' && (p.kind || 'eat') !== state.kind) return false;
      if (state.status !== 'all' && p.status !== state.status) return false;
      if (state.cuisine !== 'all' && catOf(p) !== state.cuisine) return false;
      if (state.myLoc && state.radius > 0) {
        var d = distanceOf(p);
        if (d == null || d > state.radius) return false;
      }
      return true;
    });
    arr.sort(function (a, b) {
      if (state.myLoc) {
        var da = distanceOf(a), db = distanceOf(b);
        da = da == null ? Infinity : da;
        db = db == null ? Infinity : db;
        if (da !== db) return da - db;
      }
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    return arr;
  }

  /* ================= 渲染 ================= */
  function renderAll() {
    renderStats();
    renderKindTabs();
    renderStatusTabs();
    renderCuisineChips();
    renderRadius();
    renderList();
    renderCuisineDatalist();
    updateLocUI();
    if (map) { syncMarkers(); updateMe(false); }
  }

  function renderStats() {
    var eat = state.places.filter(function (p) { return p.kind !== 'play'; }).length;
    var play = state.places.length - eat;
    var unlocated = state.places.filter(function (p) { return !hasCoord(p); }).length;
    var s = '已标记 ' + state.places.length + ' 个 · 吃 ' + eat + ' · 玩 ' + play;
    if (unlocated) s += ' · ' + unlocated + ' 个待定位';
    $('#statLine').textContent = s;
  }

  function renderKindTabs() {
    var counts = { all: state.places.length, eat: 0, play: 0 };
    state.places.forEach(function (p) { counts[p.kind === 'play' ? 'play' : 'eat']++; });
    var items = [['all', '全部'], ['eat', '吃饭'], ['play', '游玩']];
    $('#kindTabs').innerHTML = items.map(function (it) {
      var k = it[0];
      return '<button class="tab' + (state.kind === k ? ' active' : '') + '" data-kind="' + k + '">' +
        it[1] + '<b>' + counts[k] + '</b></button>';
    }).join('');
  }

  function renderStatusTabs() {
    var pool = state.places.filter(function (p) {
      return state.kind === 'all' || (p.kind || 'eat') === state.kind;
    });
    var counts = { all: pool.length, want: 0, been: 0, avoid: 0 };
    pool.forEach(function (p) { counts[p.status] = (counts[p.status] || 0) + 1; });
    var items = [['all', '全部']].concat(STATUS_ORDER.map(function (k) { return [k, STATUS[k].label]; }));
    $('#statusTabs').innerHTML = items.map(function (it) {
      var k = it[0], label = it[1];
      return '<button class="tab' + (state.status === k ? ' active' : '') + '" data-status="' + k + '">' +
        label + '<b>' + counts[k] + '</b></button>';
    }).join('');
  }

  function renderCuisineChips() {
    var playing = state.kind === 'play';
    var map = {};
    state.places.forEach(function (p) {
      if (playing && p.kind !== 'play') return;
      if (!playing && p.kind === 'play') return;
      var c = catOf(p);
      if (!c) return;
      map[c] = (map[c] || 0) + 1;
    });
    var list = Object.keys(map).sort(function (a, b) { return map[b] - map[a]; });
    var html = '<button class="chip' + (state.cuisine === 'all' ? ' active' : '') + '" data-cuisine="all">' +
      (playing ? '全部分类' : '全部菜系') + '</button>';
    html += list.map(function (c) {
      return '<button class="chip' + (state.cuisine === c ? ' active' : '') + '" data-cuisine="' + esc(c) + '">' +
        esc(c) + ' ' + map[c] + '</button>';
    }).join('');
    $('#cuisineChips').innerHTML = list.length ? html : '';
  }

  function renderCuisineDatalist() {
    var seen = {};
    var list = [];
    state.places.forEach(function (p) {
      if (p.cuisine && !seen[p.cuisine]) { seen[p.cuisine] = 1; list.push(p.cuisine); }
    });
    $('#cuisineList').innerHTML = list.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
  }

  function renderRadius() {
    var row = $('#radiusRow');
    if (!state.myLoc) {
      row.style.display = 'none';
      row.innerHTML = '';
      return;
    }
    row.style.display = '';
    row.innerHTML = '<span class="radius-label">距离</span>' + RADII.map(function (r) {
      return '<button class="chip' + (state.radius === r.v ? ' active' : '') + '" data-radius="' + r.v + '">' +
        r.label + '</button>';
    }).join('');
  }

  function renderList() {
    var list = $('#list');
    var vis = visiblePlaces();
    var unlocated = state.places.filter(function (p) { return !hasCoord(p); });
    var html = '';

    if (unlocated.length) {
      html += '<button class="locate-cta" data-act="locate-all">有 ' + unlocated.length +
        ' 家还没定位 · 点这里，一家一家在地图上点位置 →</button>';
    }

    if (!state.places.length) {
      html += '<div class="empty"><b>还没有标记的店</b>' +
        '点下面「＋ 标记一家」，或者把探店笔记「批量粘贴」进来。<br>' +
        '先点「定位」或「地图选点」，之后就能按距离找附近。</div>';
    } else if (!vis.length) {
      html += '<div class="empty"><b>没有符合条件的店</b>试试清空搜索或换个筛选。</div>';
    }

    vis.forEach(function (p) {
      var st = STATUS[p.status] || STATUS.want;
      var d = distanceOf(p);
      var meta = [];
      if (p.kind === 'play') {
        if (p.category) meta.push(p.category);
        meta.push(p.indoor ? '室内' : '室外');
        if (p.season) meta.push(p.season);
        if (p.cost) meta.push(p.cost);
      } else {
        if (p.person) meta.push(p.person + ' 推荐');
        if (p.cuisine) meta.push(p.cuisine);
      }
      if (p.area) meta.push(p.area);
      if (p.price != null) meta.push('人均 ¥' + p.price);
      if (p.rating != null) meta.push('★ ' + p.rating);
      if (!meta.length && p.address) meta.push(p.address);

      var distHtml;
      if (d != null) {
        distHtml = fmtDist(d) + '<span>' + (d <= 3000 ? '步行 ' + walkMin(d) + ' 分' : '开车 ' + driveMin(d) + ' 分') + '</span>';
      } else if (!hasCoord(p)) {
        distHtml = '<em>未定位</em>';
      } else {
        distHtml = '';
      }

      html += '<div class="card' + (state.selected === p.id ? ' sel' : '') + (p.kind === 'play' ? ' play' : '') + '" data-id="' + p.id + '" tabindex="0" role="button">' +
        '<span class="card-bar" style="background:' + (p.kind === 'play' ? '#0ea5e9' : st.color) + '"></span>' +
        '<span class="card-main">' +
        '<span class="card-title">' + esc(p.name) +
        (p.kind === 'play' ? '<em class="tag play">玩</em>' : '') +
        (p.approx ? '<em class="tag">坐标待校准</em>' : '') + '</span>' +
        (meta.length ? '<span class="card-meta">' + esc(meta.join(' · ')) + '</span>' : '') +
        (p.note ? '<span class="card-note">' + esc(p.note) + '</span>' : '') +
        '</span>' +
        '<span class="card-dist">' + distHtml + '</span>' +
        '</div>';
    });

    list.innerHTML = html;
  }

  function updateLocUI() {
    var card = $('#locCard');
    card.classList.toggle('on', !!state.myLoc);
    if (state.myLoc) {
      $('#locName').textContent = state.myLoc.label || '当前位置';
      $('#locHint').textContent = '按到这里的距离排序 · ' +
        state.myLoc.lat.toFixed(4) + ', ' + state.myLoc.lng.toFixed(4);
    } else {
      $('#locName').textContent = '我的位置未设置';
      $('#locHint').textContent = '设置后按距离排序';
    }
  }

  /* ================= 位置 ================= */
  function setMyLoc(loc) {
    state.myLoc = loc;
    save();
    renderAll();
    if (map) map.setView([loc.lat, loc.lng], Math.max(map.getZoom(), 14), { animate: true });
  }

  function geoLocate() {
    if (!navigator.geolocation) {
      toast('这个浏览器不支持定位，用「地图选点」吧');
      startPick({ kind: 'mine' });
      return;
    }
    toast('正在定位…', { duration: 1600 });
    navigator.geolocation.getCurrentPosition(function (pos) {
      var g = wgs2gcj(pos.coords.latitude, pos.coords.longitude);
      setMyLoc({ lat: g.lat, lng: g.lng, label: '当前位置' });
      toast('已定位');
    }, function () {
      toast('定位没成功（本地文件常被浏览器禁用），直接在地图上点一下也行');
      startPick({ kind: 'mine' });
    }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  }

  /* ================= 地图选点 ================= */
  function startPick(mode) {
    pickMode = mode;
    updatePickBanner();
    if (window.innerWidth <= 860) setView('map');
  }

  function endPick() {
    pickMode = null;
    updatePickBanner();
  }

  function updatePickBanner() {
    var b = $('#pickBanner');
    if (!pickMode) {
      b.classList.add('hidden');
      document.body.classList.remove('picking');
      return;
    }
    b.classList.remove('hidden');
    document.body.classList.add('picking');
    var skip = $('#pickSkip');
    if (pickMode.kind === 'mine') {
      $('#pickText').textContent = '点地图上的位置，当作「我在哪」';
      skip.style.display = 'none';
    } else if (pickMode.kind === 'move') {
      var p = findPlace(pickMode.placeId);
      $('#pickText').textContent = '点地图，给「' + (p ? p.name : '这家') + '」定位置';
      skip.style.display = 'none';
    } else {
      var cur = findPlace(pickMode.ids[pickMode.i]);
      $('#pickText').textContent = '给「' + (cur ? cur.name : '') + '」选位置（' +
        (pickMode.i + 1) + '/' + pickMode.ids.length + '）';
      skip.style.display = '';
    }
  }

  function handlePick(lat, lng) {
    if (!pickMode) return;
    if (pickMode.kind === 'mine') {
      setMyLoc({ lat: lat, lng: lng, label: '地图选点' });
      endPick();
      toast('位置已设置，列表按距离排好了');
      return;
    }
    if (pickMode.kind === 'move') {
      var p = findPlace(pickMode.placeId);
      if (p) { p.lat = lat; p.lng = lng; p.approx = false; save(); }
      endPick();
      renderAll();
      if (p) selectPlace(p.id, false);
      toast('位置已更新');
      return;
    }
    var id = pickMode.ids[pickMode.i];
    var q = findPlace(id);
    if (q) { q.lat = lat; q.lng = lng; q.approx = false; save(); }
    pickMode.i++;
    if (pickMode.i >= pickMode.ids.length) {
      endPick();
      renderAll();
      toast('都定位好了');
    } else {
      renderAll();
      updatePickBanner();
      if (map) map.panTo([lat, lng]);
    }
  }

  /* ================= 详情 ================= */
  function selectPlace(id, fly) {
    var p = findPlace(id);
    if (!p) return;
    state.selected = id;
    renderDetail();
    renderList();
    if (map) syncMarkers();
    if (fly && hasCoord(p) && map) {
      map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 15), { duration: 0.7 });
    }
    var card = $('#list .card[data-id="' + id + '"]');
    if (card && card.scrollIntoView) card.scrollIntoView({ block: 'nearest' });
  }

  function closeDetail() {
    state.selected = null;
    $('#detail').classList.remove('open');
    renderList();
    if (map) syncMarkers();
  }

  function detailHTML(p) {
    var st = STATUS[p.status] || STATUS.want;
    var play = p.kind === 'play';
    var d = distanceOf(p);
    var meta = [];
    if (play) {
      if (p.category) meta.push(p.category);
      meta.push(p.indoor ? '室内' : '室外');
      if (p.season) meta.push('适合 ' + p.season);
      if (p.cost) meta.push(p.cost);
    } else {
      if (p.cuisine) meta.push(p.cuisine);
      if (p.price != null) meta.push('人均 ¥' + p.price);
      if (p.rating != null) meta.push('★ ' + p.rating);
    }
    if (p.area) meta.push(p.area);

    var distBox = d != null
      ? '<div class="dist-box"><b>' + fmtDist(d) + '</b><span>直线距离 · 步行约 ' + walkMin(d) +
        ' 分钟 · 开车约 ' + driveMin(d) + ' 分钟</span></div>'
      : (hasCoord(p)
        ? '<div class="dist-box muted"><b>距离未知</b><span>先设置「我的位置」，就能算距离</span></div>'
        : '<div class="dist-box muted"><b>还没定位</b><span>点右下「在地图上定位」，在地图上点一下就能算距离</span></div>');

    var html = '<div class="sheet-head">' +
      '<div class="sheet-head-main">' +
      '<span class="pill" style="--c:' + (play ? '#0ea5e9' : st.color) + '">' + (play ? '游玩' : st.label) + '</span>' +
      '<h2>' + esc(p.name) + '</h2>' +
      '<div class="sheet-sub">' + (meta.length ? esc(meta.join(' · ')) : '&nbsp;') + '</div>' +
      '</div>' +
      '<button class="icon-btn" data-act="close" aria-label="关闭">✕</button>' +
      '</div>' +
      '<div class="sheet-body">' + distBox;

    if (p.address) html += '<div class="info-row"><span>地址</span><p>' + esc(p.address) + '</p></div>';
    if (p.area) html += '<div class="info-row"><span>商圈</span><p>' + esc(p.area) + '</p></div>';
    if (play) {
      if (p.category) html += '<div class="info-row"><span>类型</span><p>' + esc(p.category) + '</p></div>';
      html += '<div class="info-row"><span>适合</span><p>' + esc((p.indoor ? '室内' : '室外') +
        (p.season ? ' · ' + p.season : '')) + '</p></div>';
      if (p.cost) html += '<div class="info-row"><span>花费</span><p>' + esc(p.cost) + '</p></div>';
    }
    if (!play && p.person) html += '<div class="info-row"><span>推荐人</span><p>' + esc(p.person) + '</p></div>';
    if (!play && p.categories && p.categories.length) {
      html += '<div class="info-row"><span>分类</span><p>' + esc(p.categories.join(' · ')) + '</p></div>';
    }
    if (p.dishes && p.dishes.length) {
      html += '<div class="info-row"><span>推荐菜</span><p class="chips-inline">' +
        p.dishes.map(function (x) { return '<em>' + esc(x) + '</em>'; }).join('') + '</p></div>';
    }
    if (p.note) html += '<div class="info-row"><span>笔记</span><p class="note">' + esc(p.note) + '</p></div>';
    if (p.source) {
      var src = p.source;
      var label = p.sourceTitle || src.replace(/^https?:\/\//, '').replace(/\/$/, '');
      if (label.length > 46) label = label.slice(0, 46) + '…';
      html += '<div class="info-row"><span>原视频</span><p><a href="' + esc(src) + '" target="_blank" rel="noopener">' +
        esc(label) + '</a></p></div>';
    }
    if (p.xhs && p.xhs.length) {
      html += '<div class="info-row"><span>小红书</span><p class="xhs-links">' +
        p.xhs.map(function (x) {
          var t = String(x.title || '打开笔记');
          if (t.length > 24) t = t.slice(0, 24) + '…';
          return '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(t) + '</a>';
        }).join('') + '</p></div>';
    }
    if (!play) {
      html += '<div class="info-row"><span>点评</span><p><a href="' + esc(dianpingUrl(p)) +
        '" target="_blank" rel="noopener">大众点评搜「' + esc(p.name) + '」</a></p></div>';
    }

    if (hasCoord(p)) {
      html += '<div class="info-row"><span>坐标</span><p class="mono">' + p.lat.toFixed(5) + ', ' + p.lng.toFixed(5) +
        (p.approx ? ' <em class="tag">估算</em>' : '') + '</p></div>';
    }
    html += '</div>';

    html += '<div class="sheet-foot">';
    if (hasCoord(p)) {
      html += '<button class="btn primary" data-act="nav">高德导航</button>';
    }
    html += '<button class="btn" data-act="move">' + (hasCoord(p) ? '调整位置' : '在地图上定位') + '</button>' +
      '<button class="btn ghost" data-act="edit">编辑</button>' +
      '<button class="btn ghost danger" data-act="del">删除</button>' +
      '</div>';
    return html;
  }

  function renderDetail() {
    var p = findPlace(state.selected);
    var sheet = $('#detail');
    if (!p) { sheet.classList.remove('open'); return; }
    sheet.innerHTML = detailHTML(p);
    sheet.classList.add('open');
  }

  function navUrl(p) {
    return 'https://uri.amap.com/marker?position=' + p.lng + ',' + p.lat +
      '&name=' + encodeURIComponent(p.name) + '&src=tandian&coordinate=gaode&callnative=1';
  }

  function dianpingUrl(p) {
    return 'https://www.dianping.com/search/keyword/2/0_' + encodeURIComponent(p.name);
  }

  /* ================= 表单 ================= */
  function formHTML(p) {
    var isNew = !p;
    var v = p || {};
    var ratingOpts = [['', '未评分'], ['5', '5 分'], ['4.5', '4.5 分'], ['4', '4 分'],
      ['3.5', '3.5 分'], ['3', '3 分'], ['2', '2 分'], ['1', '1 分']];
    var curRating = v.rating == null ? '' : String(v.rating);
    var statusOpts = STATUS_ORDER.map(function (k) {
      return '<option value="' + k + '"' + (v.status === k ? ' selected' : '') + '>' + STATUS[k].label + '</option>';
    }).join('');

    return '<div class="modal-card form-card">' +
      '<div class="modal-head"><h2>' + (isNew ? '标记一家店' : '编辑这家店') + '</h2>' +
      '<button class="icon-btn" type="button" data-act="close">✕</button></div>' +
      '<form id="placeForm" autocomplete="off" novalidate>' +
      '<div class="form-body">' +
      '<label class="field"><span>店名 <i>*</i></span>' +
      '<input id="fName" required maxlength="80" value="' + esc(v.name || '') + '" placeholder="例：三江里"></label>' +

      '<div class="grid2">' +
      '<label class="field"><span>菜系</span><input id="fCuisine" list="cuisineList" maxlength="20" value="' +
      esc(v.cuisine || '') + '" placeholder="川菜 / 火锅"></label>' +
      '<label class="field"><span>人均（元）</span><input id="fPrice" type="number" min="0" step="1" value="' +
      (v.price == null ? '' : v.price) + '" placeholder="100"></label>' +
      '</div>' +

      '<div class="grid2">' +
      '<label class="field"><span>评分</span><select id="fRating">' +
      ratingOpts.map(function (o) {
        return '<option value="' + o[0] + '"' + (curRating === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></label>' +
      '<label class="field"><span>状态</span><select id="fStatus">' + statusOpts + '</select></label>' +
      '</div>' +

      '<label class="field"><span>地址</span><input id="fAddress" maxlength="120" value="' +
      esc(v.address || '') + '" placeholder="小营路 xx 号"></label>' +

      '<label class="field"><span>推荐菜（逗号分隔）</span><input id="fDishes" maxlength="120" value="' +
      esc((v.dishes || []).join('、')) + '" placeholder="辣子鸡、麻辣热卤"></label>' +

      '<label class="field"><span>探店笔记 / 一句话评价</span><textarea id="fNote" rows="4" maxlength="1000" ' +
      'placeholder="为什么想去 / 吃了什么 / 踩了什么雷">' + esc(v.note || '') + '</textarea></label>' +

      '<label class="field"><span>来源链接</span><input id="fSource" type="url" maxlength="500" value="' +
      esc(v.source || '') + '" placeholder="小红书 / 点评 / 视频链接"></label>' +

      '<p class="form-hint">' + (hasCoord(v)
        ? '位置：已标记。保存后可在详情里点「调整位置」拖动校准。'
        : '保存后点卡片上的「未定位」或详情里的「在地图上定位」，在地图上点一下就能放点。') + '</p>' +
      '</div>' +

      '<div class="modal-foot">' +
      '<button type="button" class="btn ghost" data-act="close">取消</button>' +
      '<button type="submit" class="btn primary">' + (isNew ? '保存' : '保存修改') + '</button>' +
      '</div></form></div>';
  }

  function openForm(place) {
    editing = place || null;
    openModal(formHTML(place));
    var form = $('#placeForm');
    form.addEventListener('submit', onFormSubmit);
    if (window.innerWidth > 860) setTimeout(function () { $('#fName').focus(); }, 60);
  }

  function onFormSubmit(e) {
    e.preventDefault();
    var name = $('#fName').value.trim();
    if (!name) { $('#fName').focus(); toast('先写个店名'); return; }
    var source = $('#fSource').value.trim();
    if (source && !/^https?:\/\//i.test(source) && source.indexOf('.') > 0) source = 'https://' + source;

    var p = editing || { id: uid(), createdAt: Date.now(), lat: null, lng: null, approx: false };
    p.name = name;
    p.cuisine = $('#fCuisine').value.trim();
    p.price = numOrNull($('#fPrice').value);
    p.rating = numOrNull($('#fRating').value);
    p.status = $('#fStatus').value;
    p.address = $('#fAddress').value.trim();
    p.note = $('#fNote').value.trim();
    p.source = source;
    p.dishes = $('#fDishes').value.split(/[,，、]/).map(function (s) { return s.trim(); }).filter(Boolean);

    var isNew = !editing;
    if (isNew) state.places.push(p);
    save();
    closeModal();
    renderAll();

    if (isNew) {
      toast(hasCoord(p) ? ('已加入：' + p.name) : '已加入，点「去定位」在地图上点一下', {
        action: '去定位',
        duration: 6000,
        onAction: function () { startQueue([p.id]); }
      });
    } else {
      toast('已保存');
      selectPlace(p.id, false);
    }
  }

  function startQueue(ids) {
    ids = ids.filter(Boolean);
    if (!ids.length) { toast('没有待定位的店'); return; }
    startPick({ kind: 'queue', ids: ids, i: 0 });
    toast('在地图上点一下，给「' + (findPlace(ids[0]) || {}).name + '」放点');
  }

  /* ================= 弹窗 ================= */
  function openModal(html) {
    var m = $('#modal');
    m.innerHTML = html;
    m.classList.remove('hidden');
  }
  function closeModal() {
    var m = $('#modal');
    m.classList.add('hidden');
    m.innerHTML = '';
  }

  function menuHTML() {
    return '<div class="modal-card menu-card">' +
      '<div class="modal-head"><h2>更多</h2><button class="icon-btn" type="button" data-act="close">✕</button></div>' +
      '<button class="menu-item" data-menu="export">导出 JSON 备份（换设备用）</button>' +
      '<button class="menu-item" data-menu="csv">导出 CSV（Excel 能打开）</button>' +
      '<button class="menu-item" data-menu="import">从 JSON 导入</button>' +
      '<button class="menu-item" data-menu="seed">恢复内置数据（会覆盖）</button>' +
      '<button class="menu-item" data-menu="locate-all">批量定位未放点的店</button>' +
      '<button class="menu-item danger" data-menu="clear">清空所有数据</button>' +
      '<p class="menu-note">数据存在这台设备的浏览器里，换浏览器、清缓存会丢。重要的店记得偶尔「导出 JSON」存一份。</p>' +
      '</div>';
  }

  function bulkHTML() {
    return '<div class="modal-card">' +
      '<div class="modal-head"><h2>批量粘贴</h2><button class="icon-btn" type="button" data-act="close">✕</button></div>' +
      '<p class="hint">一行一家。格式：<b>店名｜菜系｜人均｜评分｜一句话</b>，只有店名也能用。<br>' +
      '位置先空着，添加后点「去定位」，在地图上点一下就好。</p>' +
      '<textarea id="bulkText" class="bulk-text" placeholder="三江里｜川菜｜100｜｜辣子鸡、麻辣热卤&#10;海底捞（清河中街店）｜火锅｜120｜4.5｜服务稳、适合家庭&#10;外婆家（清河万象汇）"></textarea>' +
      '<div class="bulk-preview" id="bulkPreview">0 家</div>' +
      '<div class="modal-foot" style="margin:0 18px 16px">' +
      '<button type="button" class="btn ghost" data-act="close">取消</button>' +
      '<button type="button" class="btn primary" id="bulkAdd">添加</button>' +
      '</div></div>';
  }

  function parseBulk(text) {
    return text.split(/\r?\n/).map(function (s) { return s.trim(); })
      .filter(function (l) { return l && l.charAt(0) !== '#'; })
      .map(function (line) {
        var parts = line.split(/[|｜\t]+/).map(function (s) { return s.trim(); });
        var name = parts[0] || '';
        var cuisine = parts[1] || '';
        var price = numOrNull(parts[2]);
        var rating = numOrNull(parts[3]);
        var note = parts.slice(4).join(' ').trim();
        if (parts.length === 1) {
          name = line;
          var m = line.match(/人均\s*[:：]?\s*(\d+)/);
          if (m) price = Number(m[1]);
        }
        if (!name) return null;
        return {
          id: uid(),
          name: name.slice(0, 80),
          cuisine: cuisine,
          price: price,
          rating: rating,
          status: 'want',
          lat: null, lng: null, approx: false,
          address: '',
          note: note,
          dishes: [],
          source: '',
          createdAt: Date.now()
        };
      })
      .filter(Boolean);
  }

  /* ================= 导入导出 ================= */
  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }

  function exportJSON() {
    var payload = {
      app: '美食地图', version: 1, exportedAt: new Date().toISOString(),
      places: state.places, myLoc: state.myLoc
    };
    download('美食地图备份-' + stamp() + '.json', JSON.stringify(payload, null, 2));
    toast('已导出 ' + state.places.length + ' 家');
  }

  function csvCell(v) {
    return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  }
  function exportCSV() {
    var head = ['店名', '菜系', '人均', '评分', '状态', '地址', '纬度', '经度', '推荐菜', '笔记', '来源', '添加时间'];
    var rows = state.places.map(function (p) {
      return [
        p.name, p.cuisine, p.price == null ? '' : p.price, p.rating == null ? '' : p.rating,
        (STATUS[p.status] || {}).label || '', p.address,
        p.lat == null ? '' : p.lat, p.lng == null ? '' : p.lng,
        (p.dishes || []).join('、'), p.note, p.source,
        new Date(p.createdAt).toLocaleString('zh-CN')
      ].map(csvCell).join(',');
    });
    download('美食地图-' + stamp() + '.csv', '\ufeff' + head.map(csvCell).join(',') + '\n' + rows.join('\n'),
      'text/csv;charset=utf-8');
    toast('已导出 CSV');
  }

  function importText(text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { toast('文件不是有效的 JSON'); return; }
    var arr = Array.isArray(d) ? d : (d && d.places);
    if (!Array.isArray(arr)) { toast('文件里没有 places 数据'); return; }
    var added = 0, updated = 0;
    arr.map(normalize).forEach(function (p) {
      var idx = -1;
      for (var i = 0; i < state.places.length; i++) if (state.places[i].id === p.id) { idx = i; break; }
      if (idx >= 0) { state.places[idx] = p; updated++; }
      else { state.places.push(p); added++; }
    });
    save();
    renderAll();
    toast('导入完成：新增 ' + added + ' 家，更新 ' + updated + ' 家');
  }

  /* ================= 视图切换（手机） ================= */
  function setView(v) {
    document.body.dataset.view = v;
    $$('#bottomNav button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.nav === v);
    });
    if (v === 'map' && map) setTimeout(function () { map.invalidateSize(); }, 80);
    if (v === 'list') {
      var sc = $('#scrollArea');
      if (sc) sc.scrollTop = 0;
    }
  }

  /* ================= 事件绑定 ================= */
  function bindUI() {
    $('#btnGeo').addEventListener('click', geoLocate);
    $('#btnPickMe').addEventListener('click', function () {
      startPick({ kind: 'mine' });
      if (window.innerWidth <= 860) setView('map');
    });

    $('#btnMyLoc').addEventListener('click', function () {
      if (state.myLoc) {
        map.flyTo([state.myLoc.lat, state.myLoc.lng], Math.max(map.getZoom(), 14));
      } else {
        geoLocate();
      }
    });

    $('#btnZoomIn').addEventListener('click', function () { map.zoomIn(); });
    $('#btnZoomOut').addEventListener('click', function () { map.zoomOut(); });
    $('#btnBasemap').addEventListener('click', function () {
      setBasemap(baseMode === 'standard' ? 'satellite' : 'standard');
    });

    $('#pickCancel').addEventListener('click', function () { endPick(); });
    $('#pickSkip').addEventListener('click', function () {
      if (!pickMode || pickMode.kind !== 'queue') return;
      pickMode.i++;
      if (pickMode.i >= pickMode.ids.length) { endPick(); renderAll(); toast('定位结束'); }
      else { renderAll(); updatePickBanner(); }
    });

    var searchTimer = null;
    $('#search').addEventListener('input', function (e) {
      clearTimeout(searchTimer);
      var v = e.target.value;
      searchTimer = setTimeout(function () {
        state.q = v;
        renderList();
        syncMarkers();
      }, 120);
    });

    $('#kindTabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-kind]');
      if (!b) return;
      state.kind = b.dataset.kind;
      state.cuisine = 'all';
      renderKindTabs();
      renderStatusTabs();
      renderCuisineChips();
      renderList();
      syncMarkers();
      renderStats();
    });

    $('#statusTabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-status]');
      if (!b) return;
      state.status = b.dataset.status;
      renderStatusTabs();
      renderList();
      syncMarkers();
    });

    $('#cuisineChips').addEventListener('click', function (e) {
      var b = e.target.closest('[data-cuisine]');
      if (!b) return;
      state.cuisine = b.dataset.cuisine;
      renderCuisineChips();
      renderList();
      syncMarkers();
    });

    $('#radiusRow').addEventListener('click', function (e) {
      var b = e.target.closest('[data-radius]');
      if (!b) return;
      state.radius = Number(b.dataset.radius);
      renderRadius();
      renderList();
      syncMarkers();
      updateMe(false);
    });

    $('#list').addEventListener('click', function (e) {
      var cta = e.target.closest('[data-act="locate-all"]');
      if (cta) {
        startQueue(state.places.filter(function (p) { return !hasCoord(p); }).map(function (p) { return p.id; }));
        return;
      }
      var card = e.target.closest('.card');
      if (card) selectPlace(card.dataset.id, true);
    });
    $('#list').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var card = e.target.closest('.card');
      if (!card) return;
      e.preventDefault();
      selectPlace(card.dataset.id, true);
    });

    $('#detail').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.dataset.act;
      var p = findPlace(state.selected);
      if (act === 'close') return closeDetail();
      if (!p) return;
      if (act === 'edit') { closeDetail(); openForm(p); }
      else if (act === 'del') {
        if (!confirm('删除「' + p.name + '」？')) return;
        state.places = state.places.filter(function (x) { return x.id !== p.id; });
        save(); closeDetail(); renderAll();
        toast('已删除');
      } else if (act === 'move') {
        startPick({ kind: 'move', placeId: p.id });
        if (window.innerWidth <= 860) { closeDetail(); setView('map'); }
        toast('在地图上点一下新位置');
      } else if (act === 'nav') {
        window.open(navUrl(p), '_blank', 'noopener');
      }
    });

    $('#modal').addEventListener('click', function (e) {
      if (e.target === $('#modal')) return closeModal();
      var b = e.target.closest('[data-act="close"]');
      if (b) closeModal();
      var mi = e.target.closest('[data-menu]');
      if (mi) handleMenu(mi.dataset.menu);
    });

    $('#btnAdd').addEventListener('click', function () { openForm(null); });
    $('#btnBulk').addEventListener('click', function () {
      openModal(bulkHTML());
      var ta = $('#bulkText');
      var preview = $('#bulkPreview');
      var update = function () {
        var n = parseBulk(ta.value).length;
        preview.innerHTML = n ? ('将添加 <b>' + n + '</b> 家') : '0 家';
      };
      ta.addEventListener('input', update);
      $('#bulkAdd').addEventListener('click', function () {
        var items = parseBulk(ta.value);
        if (!items.length) { toast('没识别到内容'); return; }
        items.forEach(function (p) { state.places.push(p); });
        save(); closeModal(); renderAll();
        toast('已添加 ' + items.length + ' 家', {
          action: '去定位',
          onAction: function () {
            startQueue(items.map(function (p) { return p.id; }));
          }
        });
      });
      setTimeout(function () { ta.focus(); }, 80);
    });

    $('#btnMenu').addEventListener('click', function () { openModal(menuHTML()); });

    $('#bottomNav').addEventListener('click', function (e) {
      var b = e.target.closest('[data-nav]');
      if (!b) return;
      var nav = b.dataset.nav;
      if (nav === 'add') { openForm(null); return; }
      setView(nav);
      if (nav === 'list') closeDetail();
    });

    $('#fileInput').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { importText(String(reader.result)); };
      reader.readAsText(f, 'utf-8');
      e.target.value = '';
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (pickMode) endPick();
      else if (!$('#modal').classList.contains('hidden')) closeModal();
      else if ($('#detail').classList.contains('open')) closeDetail();
    });

    var rt = null;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { if (map) map.invalidateSize(); }, 150);
    });

    window.addEventListener('beforeunload', function () {
      if (state.places.length) save();
    });
  }

  function handleMenu(key) {
    if (key === 'export') { closeModal(); exportJSON(); }
    else if (key === 'csv') { closeModal(); exportCSV(); }
    else if (key === 'import') { closeModal(); $('#fileInput').click(); }
    else if (key === 'seed') {
      if (!confirm('用内置数据覆盖现在的 ' + state.places.length + ' 家？建议先导出备份。')) return;
      state.places = (window.SEED_PLACES || []).map(seedPlace);
      try { localStorage.setItem(SEED_KEY, String(window.SEED_VERSION || '')); } catch (e) {}
      save(); closeModal(); renderAll(); toast('内置数据已载入');
    } else if (key === 'clear') {
      if (!confirm('清空所有 ' + state.places.length + ' 家店？这个操作不能撤销。')) return;
      state.places = []; state.selected = null; save(); closeModal(); closeDetail(); renderAll();
      toast('已清空');
    } else if (key === 'locate-all') {
      closeModal();
      var ids = state.places.filter(function (p) { return !hasCoord(p); }).map(function (p) { return p.id; });
      if (!ids.length) { toast('所有店都有位置了'); return; }
      if (window.innerWidth <= 860) setView('map');
      startQueue(ids);
    }
  }

  /* ================= 启动 ================= */
  /* Netlify 免费版会注入右下角「Powered by Netlify」徽标；检测到后给 body 加 class，
     让底部导航、详情面板、图例给它让出位置，避免挡按钮。 */
  function watchBadge() {
    var n = 0;
    var t = setInterval(function () {
      if (document.getElementById('nl-badge-frame')) {
        document.body.classList.add('has-nl-badge');
        clearInterval(t);
      } else if (++n > 40) {
        clearInterval(t);
      }
    }, 200);
  }

  function boot() {
    if (typeof L === 'undefined') {
      $('#map').innerHTML = '<div class="empty"><b>地图组件没加载出来</b>文件可能不完整，请重新复制一份。</div>';
      return;
    }
    var ok = load();
    if (!ok) {
      state.places = (window.SEED_PLACES || []).map(seedPlace);
      try { localStorage.setItem(SEED_KEY, String(window.SEED_VERSION || '')); } catch (e) {}
    }
    initMap();
    bindUI();
    watchBadge();
    renderAll();
    if (!ok && state.places.length) {
      setTimeout(function () {
        toast('坐标来自美食地图，点开店 →「调整位置」可微调', {
          action: '知道', duration: 6000
        });
      }, 900);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
